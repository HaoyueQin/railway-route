[package]
name = "railway-route"
version = "0.1.0"
edition = "2024"

[dependencies]
tauri = { version = "2", features = [] }
# 更新检查/下载：HTTPS + 代理控制（仅 updater 使用；blocking 免 async runtime 依赖）
reqwest = { version = "0.12", features = ["blocking"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
tauri-build = { version = "2", features = [] }
